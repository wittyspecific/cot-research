# V3.27.1 · Macro × COT Regime + Treasury Duration COT
# Central scoring / breadth configuration. UI contains no duplicate weights.

[cot]
min_history_weeks = 52
percentile_window_weeks = 156
percentile_min_weeks = 52
level_weight = 0.40
flow_weight = 0.60
unwind_factor = 0.60
flow_scale_net_oi = 0.02
direction_neutral_threshold = 8.0
state_directional_threshold = 18.0
state_very_threshold = 55.0

[cot.flow_weights]
"1w" = 0.15
"2w" = 0.35
"4w" = 0.50

[macro]
slope_scale = 20.0
acceleration_scale = 15.0
momentum_improving_threshold = 20.0
momentum_deteriorating_threshold = -20.0

[transition_pressure.weights]
cot_persistence = 0.30
cross_asset_breadth = 0.25
macro_momentum = 0.20
leading_breadth = 0.15
financial_market_confirmation = 0.10

[rates]
# Treasury tenors are aggregated once into a synthetic duration regime.
# Individual tenor weights below are used only inside the rates basket.
basket_weight = 1.25
minimum_coverage = 0.50
breadth_lean = 0.45
breadth_strong = 0.60
persistence_threshold = 0.65
active_build_threshold = 0.55

[rates.contract_weights]
treasury2y = 0.30
treasury5y = 0.25
treasury10y = 0.25
treasury30y = 0.20

[state_machine]
minimum_cross_asset_coverage = 0.50
lean_breadth = 0.45
strong_breadth = 0.60
watch_pressure = 40.0
elevated_pressure = 60.0

# risk_off_when = contract direction that confirms Risk-Off.
# ASSET_SPECIFIC excludes the asset from cross-asset breadth.

